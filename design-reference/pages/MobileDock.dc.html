<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@media (min-width:761px){ .eb-dock{display:none !important} }
</style>
</helmet>

<nav class="eb-dock" aria-label="Main" style="{{ dockStyle }}">
  <sc-for list="{{ items }}" as="i" hint-placeholder-count="4">
    <a href="{{ i.href }}" style="{{ i.style }}">
      <span style="{{ i.markStyle }}"></span>
      <span style="position:relative;display:flex">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:block"><path d="{{ i.icon }}"></path></svg>
        <span style="{{ i.badgeStyle }}">{{ i.badge }}</span>
      </span>
      <span style="{{ i.labelStyle }}">{{ i.label }}</span>
    </a>
  </sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:90},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;shop&quot;,&quot;options&quot;:[&quot;shop&quot;,&quot;search&quot;,&quot;journal&quot;,&quot;bag&quot;,&quot;account&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;bagCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;min&quot;:0,&quot;max&quot;:20,&quot;tsType&quot;:&quot;number&quot;}}">
const R = (p) => (window.__resources && window.__resources[p]) || p;
const ICONS = {
  shop:     'M4 8h16l-1.2 12H5.2L4 8zM9 8V6.5a3 3 0 016 0V8',
  search:   'M11 4a7 7 0 100 14 7 7 0 000-14zM20 20l-4-4',
  journal:  'M5 4h9l5 5v11H5V4zM14 4v5h5M8.5 13h7M8.5 16.5h5',
  bag:      'M6 9h12l-1 11H7L6 9zM9.5 9V7a2.5 2.5 0 015 0v2',
  account:  'M12 4a4 4 0 100 8 4 4 0 000-8zM4.5 21c0-4.1 3.4-7.5 7.5-7.5s7.5 3.4 7.5 7.5'
};

const ITEMS = [
  { key:'shop',    label:'Shop',    href:'EasyBeauty Collection.html' },
  { key:'search',  label:'Search',  href:'EasyBeauty Collection.html#search' },
  { key:'bag',     label:'Bag',     href:'EasyBeauty Bag.html' },
  { key:'account', label:'You',     href:'EasyBeauty Account.html' }
];

class Component extends DCLogic {
  state = { mobile:false };

  componentDidMount() {
    this.onResize = () => {
      const mobile = window.innerWidth <= 760;
      if (mobile !== this.state.mobile) this.setState({ mobile });
      document.body.style.paddingBottom = mobile ? '78px' : '';
    };
    this.onResize();
    window.addEventListener('resize', this.onResize);
  }

  componentWillUnmount() {
    window.removeEventListener('resize', this.onResize);
    document.body.style.paddingBottom = '';
  }

  renderVals() {
    const active = this.props.active ?? 'shop';
    const bag = this.props.bagCount ?? 0;

    return {
      dockStyle: 'position:fixed;left:0;right:0;bottom:0;z-index:46;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(251,250,248,0.98);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:2px solid var(--ink);padding-bottom:env(safe-area-inset-bottom)',
      items: ITEMS.map((it) => {
        const on = it.key === active;
        return {
          label: it.label, href: it.href,
          icon: ICONS[it.key],
          style: 'position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:11px 4px 12px;color:' + (on ? 'var(--ink)' : '#8C8073') + ';text-decoration:none;-webkit-tap-highlight-color:transparent',
          markStyle: 'position:absolute;top:0;left:14%;right:14%;height:2px;background:var(--terra);transition:opacity .2s ease;opacity:' + (on ? 1 : 0),
          iconStyle: 'display:block;width:22px;height:22px',
          labelStyle: 'font-size:9.5px;letter-spacing:0.14em;text-transform:uppercase;font-weight:' + (on ? 600 : 400),
          badge: bag > 0 ? String(bag) : '',
          badgeStyle: 'position:absolute;top:-5px;right:-8px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--terra);color:#FBFAF8;font-size:9.5px;line-height:16px;text-align:center;transition:opacity .2s ease;opacity:' + (it.key === 'bag' && bag > 0 ? 1 : 0)
        };
      })
    };
  }
}
</script>
</body>
</html>
